<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --purple: #5F3685;
  --gold:   #E8B84B;
  --bg:     #F8F7FC;
  --black:  #1E1A2E;
  --muted:  #6B6880;
  --font:   'Plus Jakarta Sans', sans-serif;
}
html, body {
  height: 100%;
  background: var(--bg);
  font-family: var(--font);
  overflow: hidden;
}

/* ── BOTTOM BANNER ─── */
.book-banner {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: var(--purple);
  display: flex; align-items: center; justify-content: center; gap: 20px;
  padding: 14px 24px;
  box-shadow: 0 -4px 24px rgba(95,54,133,0.18);
}
.book-banner-text {
  font-size: 14px; color: rgba(255,255,255,0.75); font-weight: 500;
  white-space: nowrap;
}
.book-banner-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--gold); color: var(--black);
  font-family: var(--font); font-size: 14px; font-weight: 700;
  padding: 10px 28px; border-radius: 6px;
  text-decoration: none; white-space: nowrap;
  transition: opacity 0.2s, transform 0.15s;
}
.book-banner-btn:hover { opacity: 0.88; transform: translateY(-1px); }
@media (max-width: 600px) {
  .book-banner { flex-direction: column; gap: 10px; padding: 12px 16px; }
  .book-banner-text { white-space: normal; text-align: center; font-size: 13px; }
}

/* ── HEADER ─── */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  height: 52px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: rgba(248,247,252,0.96); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(95,54,133,0.10);
}
.header-logo { font-size: 18px; }
.header-name {
  font-size: 13px; font-weight: 600; color: var(--purple); letter-spacing: 0.01em;
}

/* ── IFRAME ─── */
.iframe-wrap {
  position: fixed;
  top: 52px; left: 0; right: 0; bottom: 56px;
}
.iframe-wrap iframe {
  width: 100%; height: 100%;
  border: none; display: block;
}

/* ── SUCCESS OVERLAY ─── */
.success-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease;
}
.success-overlay.is-visible {
  opacity: 1; pointer-events: all;
}
.success-icon {
  font-size: 56px; margin-bottom: 24px;
  animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes pop {
  0%   { transform: scale(0); }
  100% { transform: scale(1); }
}
.success-title {
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 800; color: var(--black);
  line-height: 1.1; letter-spacing: -0.02em;
  margin-bottom: 16px;
}
.success-sub {
  font-size: 16px; color: var(--muted);
  line-height: 1.75; max-width: 420px;
  margin-bottom: 36px;
}
.success-cta {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--gold); color: var(--black);
  font-family: var(--font); font-size: 15px; font-weight: 700;
  padding: 16px 44px; border-radius: 8px;
  text-decoration: none; transition: opacity 0.2s, transform 0.15s;
  margin-bottom: 20px;
}
.success-cta:hover { opacity: 0.88; transform: translateY(-2px); }
.success-note {
  font-size: 12px; color: var(--muted);
}
.countdown {
  display: inline-block;
  background: rgba(95,54,133,0.08);
  color: var(--purple);
  font-size: 12px; font-weight: 600;
  padding: 4px 12px; border-radius: 20px;
  margin-bottom: 28px;
}

/* ── LOADING ─── */
.loading {
  position: fixed; inset: 0; z-index: 5;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  transition: opacity 0.4s ease;
}
.loading.is-hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(95,54,133,0.12);
  border-top-color: var(--purple);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--muted); font-weight: 500; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <span class="header-logo">🧠</span>
  <span class="header-name">Brain Performance Coaching — 8D Assessment</span>
</div>

<!-- Loading state -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <span class="loading-text">Loading your assessment…</span>
</div>

<!-- Google Form iframe -->
<div class="iframe-wrap">
  <iframe
    id="assessment-iframe"
    src="https://docs.google.com/forms/d/e/1FAIpQLScg8P897e8S7oUW_SelXLOI8IXYAdr2KCIZhPleA1o9TjMIHw/viewform?embedded=true"
    title="8D Performance Assessment">
  </iframe>
</div>

<!-- Bottom booking banner — always visible -->
<div class="book-banner">
  <span class="book-banner-text">Done with the assessment?</span>
  <a href="https://cal.com/iaiacolella-braincoach/discovery" class="book-banner-btn" target="_blank">
    Book Your Free Discovery Call →
  </a>
</div>

<script>
const iframe = document.getElementById('assessment-iframe');
const loading = document.getElementById('loading');

// Hide loading spinner once the form is ready
iframe.addEventListener('load', function() {
  loading.classList.add('is-hidden');
  // Fire Meta Pixel event
  if (typeof fbq !== 'undefined') { fbq('track', 'ViewContent'); }
});
</script>

</body>
</html>
